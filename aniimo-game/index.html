<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Monster Trek</title>
<style>
  :root { --tile: 48px; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #10151a;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  h1 { margin: 4px 0; }
  #sub { opacity: 0.7; font-size: 0.85em; margin-bottom: 10px; }

  #screens { position: relative; width: 100%; max-width: 620px; }
  .screen { display: none; }
  .screen.active { display: block; }

  /* ---- Starter select ---- */
  #starterList { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  .starterCard {
    background: #1d2733;
    border: 2px solid #334;
    border-radius: 10px;
    padding: 14px;
    width: 140px;
    text-align: center;
    cursor: pointer;
  }
  .starterCard:hover { border-color: #f5c242; }
  .starterCard .icon { font-size: 2.6em; }
  .typeTag {
    display: inline-block;
    font-size: 0.7em;
    padding: 2px 8px;
    border-radius: 10px;
    margin-top: 4px;
  }

  /* ---- Map ---- */
  #mapWrap { display: flex; justify-content: center; }
  #map {
    display: grid;
    gap: 1px;
    background: #000;
    border: 3px solid #445;
    border-radius: 6px;
  }
  .tile {
    width: var(--tile);
    height: var(--tile);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3em;
  }
  .tile.grass { background: #2f6b35; }
  .tile.path { background: #5b4a32; }
  .tile.water { background: #1c5d8c; }
  .tile.tall { background: #1f4a24; }
  .tile.player { background: #5b4a32; }

  #hud { display: flex; justify-content: space-between; width: 100%; max-width: 620px; margin-top: 10px; font-size: 0.9em; }
  #teamBar { display: flex; gap: 6px; }
  .teamIcon {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: #26323f; border: 2px solid #445;
    font-size: 1.1em;
  }
  .teamIcon.fainted { opacity: 0.3; }

  #controls { margin-top: 10px; display: grid; grid-template-columns: 50px 50px 50px; grid-template-rows: 44px 44px 44px; gap: 4px; justify-content: center; }
  #controls button { font-size: 1.2em; }
  #ctrlUp { grid-column: 2; grid-row: 1; }
  #ctrlLeft { grid-column: 1; grid-row: 2; }
  #ctrlDown { grid-column: 2; grid-row: 2; }
  #ctrlRight { grid-column: 3; grid-row: 2; }

  button {
    background: #f39c12;
    color: #222;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { background: #e67e22; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ---- Battle ---- */
  #battleScreen { background: #1a2430; border-radius: 10px; padding: 16px; }
  .battleRow { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .battler { text-align: center; width: 45%; }
  .battler .icon { font-size: 3em; }
  .hpBarOuter { background: #333; border-radius: 6px; height: 10px; overflow: hidden; margin-top: 4px; }
  .hpBarInner { background: #2ecc71; height: 100%; transition: width 0.3s ease; }
  .hpBarInner.low { background: #e74c3c; }
  #battleLog { background: #0f161d; border-radius: 6px; padding: 8px; min-height: 48px; font-size: 0.9em; margin: 10px 0; }
  #battleActions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #moveList, #itemList, #teamList { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .typeTag.normal { background:#95a5a6; color:#222; }
  .typeTag.fire { background:#e74c3c; }
  .typeTag.water { background:#2980b9; }
  .typeTag.grass { background:#27ae60; }
  .typeTag.electric { background:#f1c40f; color:#222; }
  .typeTag.rock { background:#8d6e63; }
</style>
</head>
<body>

<h1>🐾 Monster Trek</h1>
<div id="sub">A tiny creature-catching adventure, inspired by Aniimo</div>

<div id="screens">

  <div class="screen active" id="starterScreen">
    <p>Choose your starter companion:</p>
    <div id="starterList"></div>
  </div>

  <div class="screen" id="mapScreen">
    <div id="mapWrap"><div id="map"></div></div>
    <div id="hud">
      <div id="teamBar"></div>
      <div id="coords"></div>
    </div>
    <div id="controls">
      <button id="ctrlUp">↑</button>
      <button id="ctrlLeft">←</button>
      <button id="ctrlDown">↓</button>
      <button id="ctrlRight">→</button>
    </div>
    <p style="opacity:0.6; font-size:0.8em; text-align:center;">Arrow keys / WASD also work. Walk in tall grass to find wild Aniimo.</p>
  </div>

  <div class="screen" id="battleScreen">
    <div class="battleRow">
      <div class="battler" id="enemyBattler"></div>
      <div class="battler" id="playerBattler"></div>
    </div>
    <div id="battleLog">A wild creature appeared!</div>
    <div id="battleActions">
      <button id="btnFight">Fight</button>
      <button id="btnCatch">Catch</button>
      <button id="btnTeam">Team</button>
      <button id="btnRun">Run</button>
    </div>
    <div id="moveList" style="display:none; margin-top:10px;"></div>
    <div id="teamList" style="display:none; margin-top:10px;"></div>
  </div>

</div>

<script>
/* ---------------- Data ---------------- */
const SPECIES = [
  { id: "flambub",  name: "Flambub",  type: "fire",     icon: "🔥", base: { hp: 32, atk: 11, def: 7 },  evoLevel: 8,  evoTo: "flamaul" },
  { id: "flamaul",  name: "Flamaul",  type: "fire",     icon: "🐉", base: { hp: 48, atk: 17, def: 10 } },
  { id: "aquorb",   name: "Aquorb",   type: "water",    icon: "💧", base: { hp: 34, atk: 9,  def: 9 },  evoLevel: 8,  evoTo: "aquiron" },
  { id: "aquiron",  name: "Aquiron",  type: "water",    icon: "🐋", base: { hp: 50, atk: 14, def: 14 } },
  { id: "leafkit",  name: "Leafkit",  type: "grass",    icon: "🌿", base: { hp: 33, atk: 10, def: 8 },  evoLevel: 8,  evoTo: "florabeast" },
  { id: "florabeast", name: "Florabeast", type: "grass", icon: "🌳", base: { hp: 49, atk: 15, def: 12 } },
  { id: "sparchick", name: "Sparchick", type: "electric", icon: "⚡", base: { hp: 28, atk: 13, def: 6 }, evoLevel: 7, evoTo: "voltjay" },
  { id: "voltjay",  name: "Voltjay",  type: "electric", icon: "🦅", base: { hp: 42, atk: 19, def: 8 } },
  { id: "pebblit",  name: "Pebblit",  type: "rock",     icon: "🪨", base: { hp: 38, atk: 8,  def: 14 }, evoLevel: 9, evoTo: "boulderon" },
  { id: "boulderon", name: "Boulderon", type: "rock",   icon: "🗿", base: { hp: 55, atk: 12, def: 20 } },
  { id: "mossling", name: "Mossling", type: "grass",    icon: "🍃", base: { hp: 30, atk: 9,  def: 9 } },
  { id: "finbit",   name: "Finbit",   type: "water",    icon: "🐟", base: { hp: 29, atk: 10, def: 7 } },
];

const MOVES = {
  fire:     [{ name: "Ember",      power: 9  }, { name: "Flame Burst", power: 14 }],
  water:    [{ name: "Aqua Jet",   power: 9  }, { name: "Tidal Slam",  power: 14 }],
  grass:    [{ name: "Vine Whip",  power: 9  }, { name: "Leaf Storm",  power: 14 }],
  electric: [{ name: "Spark",      power: 10 }, { name: "Volt Surge",  power: 15 }],
  rock:     [{ name: "Rock Toss",  power: 10 }, { name: "Boulder Crush", power: 15 }],
};

const TYPE_EFFECT = {
  fire: { grass: 1.5, water: 0.6 },
  water: { fire: 1.5, grass: 0.6 },
  grass: { water: 1.5, fire: 0.6 },
  electric: { water: 1.5, rock: 0.6 },
  rock: { fire: 1.5, electric: 0.6 },
};

function speciesById(id) { return SPECIES.find(s => s.id === id); }

function makeCreature(speciesId, level) {
  const sp = speciesById(speciesId);
  const hp = sp.base.hp + level * 3;
  return {
    speciesId,
    name: sp.name,
    level,
    xp: 0,
    hp,
    maxHp: hp,
    atk: sp.base.atk + level,
    def: sp.base.def + level,
  };
}

/* ---------------- State ---------------- */
let team = [];
let player = { x: 5, y: 4 };
const MAP_W = 11, MAP_H = 9;
let mapTiles = [];
let wildEncounter = null;
let battleContext = null; // { enemy, choosingMove, pendingSwitch }

/* ---------------- Map generation ---------------- */
function buildMap() {
  mapTiles = [];
  for (let y = 0; y < MAP_H; y++) {
    const row = [];
    for (let x = 0; x < MAP_W; x++) {
      let t = "grass";
      if (x === 0 || y === 0 || x === MAP_W - 1 || y === MAP_H - 1) t = "water";
      else if ((x + y) % 5 === 0) t = "path";
      else if (Math.random() < 0.35) t = "tall";
      row.push(t);
    }
    mapTiles.push(row);
  }
  mapTiles[4][5] = "path"; // start tile
}

function renderMap() {
  const mapEl = document.getElementById("map");
  mapEl.style.gridTemplateColumns = `repeat(${MAP_W}, var(--tile))`;
  mapEl.innerHTML = "";
  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      const div = document.createElement("div");
      const isPlayer = x === player.x && y === player.y;
      div.className = "tile " + mapTiles[y][x];
      if (isPlayer) div.textContent = "🧑";
      else if (mapTiles[y][x] === "tall") div.textContent = "🌾";
      else if (mapTiles[y][x] === "water") div.textContent = "🌊";
      mapEl.appendChild(div);
    }
  }
  document.getElementById("coords").textContent = `(${player.x}, ${player.y})`;
  renderTeamBar();
}

function renderTeamBar() {
  const bar = document.getElementById("teamBar");
  bar.innerHTML = "";
  team.forEach(c => {
    const sp = speciesById(c.speciesId);
    const icon = document.createElement("div");
    icon.className = "teamIcon" + (c.hp <= 0 ? " fainted" : "");
    icon.textContent = sp.icon;
    icon.title = `${c.name} Lv.${c.level} (${c.hp}/${c.maxHp} HP)`;
    bar.appendChild(icon);
  });
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ---------------- Starter selection ---------------- */
function renderStarters() {
  const starterIds = ["flambub", "aquorb", "leafkit", "sparchick"];
  const list = document.getElementById("starterList");
  list.innerHTML = "";
  starterIds.forEach(id => {
    const sp = speciesById(id);
    const card = document.createElement("div");
    card.className = "starterCard";
    card.innerHTML = `
      <div class="icon">${sp.icon}</div>
      <div>${sp.name}</div>
      <div class="typeTag ${sp.type}">${sp.type}</div>
    `;
    card.addEventListener("click", () => chooseStarter(id));
    list.appendChild(card);
  });
}

function chooseStarter(id) {
  team = [makeCreature(id, 5)];
  buildMap();
  showScreen("mapScreen");
  renderMap();
}

/* ---------------- Movement & encounters ---------------- */
function tryMove(dx, dy) {
  if (wildEncounter) return;
  const nx = player.x + dx, ny = player.y + dy;
  if (nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H) return;
  if (mapTiles[ny][nx] === "water") return;
  player.x = nx; player.y = ny;
  renderMap();

  if (mapTiles[ny][nx] === "tall" && Math.random() < 0.3) {
    startWildEncounter();
  }
}

document.addEventListener("keydown", e => {
  const map = { ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0],
    w: [0,-1], s: [0,1], a: [-1,0], d: [1,0] };
  if (map[e.key] && document.getElementById("mapScreen").classList.contains("active")) {
    tryMove(...map[e.key]);
  }
});
document.getElementById("ctrlUp").addEventListener("click", () => tryMove(0,-1));
document.getElementById("ctrlDown").addEventListener("click", () => tryMove(0,1));
document.getElementById("ctrlLeft").addEventListener("click", () => tryMove(-1,0));
document.getElementById("ctrlRight").addEventListener("click", () => tryMove(1,0));

/* ---------------- Battle ---------------- */
function activeCreature() {
  return team.find(c => c.hp > 0) || null;
}

function startWildEncounter() {
  const pool = SPECIES.filter(s => !s.evoLevel ? true : true); // any species can appear wild, incl. pre-evos mostly
  const wildPool = SPECIES.filter(s => ["flambub","aquorb","leafkit","sparchick","pebblit","mossling","finbit"].includes(s.id));
  const sp = wildPool[Math.floor(Math.random() * wildPool.length)];
  const level = Math.max(1, Math.floor(Math.random() * 6) + 1);
  wildEncounter = makeCreature(sp.id, level);
  battleContext = { enemy: wildEncounter, fled: false };
  showScreen("battleScreen");
  setBattleLog(`A wild ${wildEncounter.name} (Lv.${wildEncounter.level}) appeared!`);
  renderBattle();
}

function setBattleLog(msg) {
  document.getElementById("battleLog").textContent = msg;
}

function renderBattle() {
  const p = activeCreature();
  const e = battleContext.enemy;

  document.getElementById("enemyBattler").innerHTML = battlerHtml(e, speciesById(e.speciesId).icon);
  document.getElementById("playerBattler").innerHTML = p
    ? battlerHtml(p, speciesById(p.speciesId).icon)
    : "<div>No creatures left!</div>";

  document.getElementById("moveList").style.display = "none";
  document.getElementById("teamList").style.display = "none";
  document.getElementById("battleActions").style.display = "grid";

  const noneAlive = !p;
  document.getElementById("btnFight").disabled = noneAlive;
  document.getElementById("btnCatch").disabled = noneAlive;
}

function battlerHtml(c, icon) {
  const pct = Math.max(0, Math.round((c.hp / c.maxHp) * 100));
  return `
    <div class="icon">${icon}</div>
    <div>${c.name} Lv.${c.level}</div>
    <div class="hpBarOuter"><div class="hpBarInner ${pct < 30 ? "low" : ""}" style="width:${pct}%"></div></div>
    <div style="font-size:0.75em; opacity:0.75;">${Math.max(0,c.hp)}/${c.maxHp} HP</div>
  `;
}

document.getElementById("btnFight").addEventListener("click", () => {
  const p = activeCreature();
  if (!p) return;
  const sp = speciesById(p.speciesId);
  const moves = MOVES[sp.type];
  const listEl = document.getElementById("moveList");
  listEl.innerHTML = "";
  moves.forEach(m => {
    const b = document.createElement("button");
    b.textContent = `${m.name} (${m.power})`;
    b.addEventListener("click", () => playerAttack(m));
    listEl.appendChild(b);
  });
  listEl.style.display = "grid";
  document.getElementById("battleActions").style.display = "none";
});

document.getElementById("btnTeam").addEventListener("click", () => {
  const listEl = document.getElementById("teamList");
  listEl.innerHTML = "";
  team.forEach((c, idx) => {
    const b = document.createElement("button");
    const current = activeCreature() === c;
    b.textContent = `${c.name} Lv.${c.level} (${Math.max(0,c.hp)}/${c.maxHp})`;
    b.disabled = c.hp <= 0 || current;
    b.addEventListener("click", () => switchActive(idx));
    listEl.appendChild(b);
  });
  listEl.style.display = "grid";
  document.getElementById("battleActions").style.display = "none";
});

function switchActive(idx) {
  const chosen = team[idx];
  if (chosen.hp <= 0) return;
  team.splice(idx, 1);
  team.unshift(chosen);
  setBattleLog(`Go, ${chosen.name}!`);
  renderBattle();
  document.getElementById("teamList").style.display = "none";
  document.getElementById("battleActions").style.display = "grid";
  setTimeout(enemyTurn, 900);
}

document.getElementById("btnRun").addEventListener("click", () => {
  wildEncounter = null;
  battleContext = null;
  showScreen("mapScreen");
  renderMap();
});

document.getElementById("btnCatch").addEventListener("click", () => {
  const e = battleContext.enemy;
  const chance = Math.min(0.9, 0.9 * (1 - e.hp / e.maxHp) + 0.1);
  if (Math.random() < chance) {
    setBattleLog(`Caught ${e.name}!`);
    team.push(makeCreature(e.speciesId, e.level));
    battleContext = null;
    wildEncounter = null;
    setTimeout(() => { showScreen("mapScreen"); renderMap(); }, 1200);
  } else {
    setBattleLog(`${e.name} broke free!`);
    setTimeout(enemyTurn, 900);
  }
});

function damage(attacker, defender, move) {
  const atkSp = speciesById(attacker.speciesId);
  const defSp = speciesById(defender.speciesId);
  const typeMult = (TYPE_EFFECT[atkSp.type] && TYPE_EFFECT[atkSp.type][defSp.type]) || 1;
  const raw = (move.power + attacker.atk) - defender.def * 0.5;
  return Math.max(1, Math.round(raw * typeMult));
}

function playerAttack(move) {
  const p = activeCreature();
  const e = battleContext.enemy;
  const dmg = damage(p, e, move);
  e.hp -= dmg;
  setBattleLog(`${p.name} used ${move.name}! Dealt ${dmg} damage.`);
  document.getElementById("moveList").style.display = "none";
  document.getElementById("battleActions").style.display = "grid";
  renderBattle();

  if (e.hp <= 0) {
    e.hp = 0;
    renderBattle();
    winBattle(p, e);
    return;
  }
  setTimeout(enemyTurn, 900);
}

function enemyTurn() {
  const p = activeCreature();
  const e = battleContext.enemy;
  if (!p) { loseBattle(); return; }

  const sp = speciesById(e.speciesId);
  const moves = MOVES[sp.type];
  const move = moves[Math.floor(Math.random() * moves.length)];
  const dmg = damage(e, p, move);
  p.hp -= dmg;
  setBattleLog(`${e.name} used ${move.name}! Dealt ${dmg} damage.`);
  renderBattle();

  if (p.hp <= 0) {
    p.hp = 0;
    renderBattle();
    if (!activeCreature()) {
      setTimeout(loseBattle, 1000);
    } else {
      setBattleLog(`${p.name} fainted! Choose your next creature.`);
      setTimeout(() => document.getElementById("btnTeam").click(), 1000);
    }
  } else {
    renderBattle();
  }
}

function winBattle(p, e) {
  const xpGain = 8 + e.level * 3;
  p.xp += xpGain;
  setBattleLog(`${e.name} fainted! ${p.name} gained ${xpGain} XP.`);
  const xpToLevel = p.level * 12;
  if (p.xp >= xpToLevel) {
    p.xp -= xpToLevel;
    p.level += 1;
    const sp = speciesById(p.speciesId);
    p.maxHp = sp.base.hp + p.level * 3;
    p.hp = p.maxHp;
    p.atk = sp.base.atk + p.level;
    p.def = sp.base.def + p.level;
    setBattleLog(`${p.name} leveled up to Lv.${p.level}!`);
    if (sp.evoLevel && p.level >= sp.evoLevel && sp.evoTo) {
      const newSp = speciesById(sp.evoTo);
      p.speciesId = newSp.id;
      p.name = newSp.name;
      p.maxHp = newSp.base.hp + p.level * 3;
      p.hp = p.maxHp;
      p.atk = newSp.base.atk + p.level;
      p.def = newSp.base.def + p.level;
      setBattleLog(`${sp.name} evolved into ${newSp.name}!`);
    }
  }
  battleContext = null;
  wildEncounter = null;
  setTimeout(() => { showScreen("mapScreen"); renderMap(); }, 1400);
}

function loseBattle() {
  setBattleLog("All your creatures fainted! Retreating to heal...");
  team.forEach(c => { const sp = speciesById(c.speciesId); c.hp = c.maxHp; });
  battleContext = null;
  wildEncounter = null;
  setTimeout(() => { showScreen("mapScreen"); renderMap(); }, 1400);
}

/* ---------------- Init ---------------- */
renderStarters();
</script>

</body>
</html>
