<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Monster Trek: Card Clash</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: radial-gradient(circle at top, #1b2630 0%, #0c1116 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px;
  }
  h1 { margin: 4px 0; font-size: 1.4em; }
  #sub { opacity: 0.7; font-size: 0.8em; margin-bottom: 10px; text-align: center; }

  #game { width: 100%; max-width: 820px; }

  .playerRow {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 4px 0;
    padding: 6px 10px;
    border-radius: 8px;
    background: rgba(255,255,255,0.04);
  }
  .lifeBadge, .energyBadge, .deckBadge {
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 0.85em;
    font-weight: bold;
  }
  .lifeBadge { background: #6b1f1f; }
  .energyBadge { background: #1f4a6b; }
  .deckBadge { background: #333; opacity: 0.85; }
  .rowLabel { font-size: 0.8em; opacity: 0.75; margin-right: auto; }

  .board {
    display: flex;
    gap: 8px;
    min-height: 118px;
    padding: 8px;
    border-radius: 8px;
    background: rgba(0,0,0,0.25);
    flex-wrap: wrap;
    justify-content: center;
  }
  .boardSlotEmpty {
    width: 84px; height: 110px;
    border: 2px dashed rgba(255,255,255,0.15);
    border-radius: 8px;
  }

  .card {
    width: 84px;
    min-height: 110px;
    border-radius: 8px;
    padding: 5px;
    border: 2px solid rgba(255,255,255,0.7);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
    position: relative;
    text-align: center;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .card:hover { transform: translateY(-4px); }
  .card.selected { box-shadow: 0 0 0 3px #f5c242; transform: translateY(-6px); }
  .card.resting { opacity: 0.55; cursor: default; }
  .card.attacked { opacity: 0.75; }
  .card.disabled { opacity: 0.4; cursor: not-allowed; }
  .card .cost {
    position: absolute; top: -8px; left: -8px;
    background: #222; border: 2px solid #f5c242; color: #f5c242;
    width: 22px; height: 22px; border-radius: 50%;
    font-size: 0.75em; display: flex; align-items: center; justify-content: center;
    font-weight: bold;
  }
  .card .icon { font-size: 1.8em; margin-top: 4px; }
  .card .name { font-size: 0.68em; font-weight: bold; line-height: 1.1; }
  .card .stats { font-size: 0.7em; display: flex; gap: 6px; }
  .card .stats .atk { color: #ff8a65; }
  .card .stats .hp { color: #80e27e; }

  .card.fire     { background: linear-gradient(160deg, #6b2d1f, #3a140c); }
  .card.water    { background: linear-gradient(160deg, #1f3f6b, #0c1f3a); }
  .card.grass    { background: linear-gradient(160deg, #1f6b35, #0c3a1a); }
  .card.electric { background: linear-gradient(160deg, #6b5f1f, #3a330c); color:#fff; }
  .card.rock     { background: linear-gradient(160deg, #4a3b2d, #241b14); }

  .card.back {
    background: repeating-linear-gradient(45deg, #333, #333 6px, #555 6px, #555 12px);
    cursor: default;
  }

  #hand {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    min-height: 118px;
    padding: 8px;
  }

  #enemyHandRow {
    display: flex;
    gap: 6px;
    justify-content: center;
  }
  .miniBack {
    width: 40px; height: 56px;
    border-radius: 6px;
    background: repeating-linear-gradient(45deg, #333, #333 5px, #555 5px, #555 10px);
    border: 1px solid #555;
  }

  #controls { display: flex; justify-content: center; gap: 10px; margin: 10px 0; }
  button {
    background: #f39c12;
    color: #222;
    border: none;
    padding: 9px 18px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 0.95em;
  }
  button:hover { background: #e67e22; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  #log {
    width: 100%;
    max-height: 90px;
    overflow-y: auto;
    font-size: 0.8em;
    opacity: 0.8;
    background: rgba(0,0,0,0.3);
    border-radius: 6px;
    padding: 6px 10px;
    margin-top: 6px;
  }

  #turnBanner {
    text-align: center;
    font-size: 0.95em;
    margin: 4px 0;
    padding: 4px;
    border-radius: 6px;
    background: rgba(255,255,255,0.06);
  }

  #overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    text-align: center;
  }
  #overlay .box { background: #1a1a1a; padding: 28px 36px; border-radius: 12px; }
  #overlay h2 { margin: 0 0 12px; }
</style>
</head>
<body>

<h1>🃏 Monster Trek: Card Clash</h1>
<div id="sub">A 2D card battler built from the Monster Trek creatures — play, attack, win.</div>

<div id="game">

  <div class="playerRow">
    <span class="rowLabel">Opponent</span>
    <span class="lifeBadge" id="enemyLife"></span>
    <span class="energyBadge" id="enemyEnergy"></span>
    <span class="deckBadge" id="enemyDeckCount"></span>
    <div id="enemyHandRow"></div>
  </div>

  <div class="board" id="enemyBoard"></div>

  <div id="turnBanner"></div>

  <div class="board" id="playerBoard"></div>

  <div class="playerRow">
    <span class="rowLabel">You</span>
    <span class="lifeBadge" id="playerLife"></span>
    <span class="energyBadge" id="playerEnergy"></span>
    <span class="deckBadge" id="playerDeckCount"></span>
  </div>

  <div id="hand"></div>

  <div id="controls">
    <button id="endTurnBtn">End Turn</button>
    <button id="newGameBtn">New Game</button>
  </div>

  <div id="log"></div>
</div>

<div id="overlay">
  <div class="box">
    <h2 id="overlayTitle"></h2>
    <button id="overlayBtn">Play Again</button>
  </div>
</div>

<script>
/* ---------------- Card data ---------------- */
const SPECIES = [
  { id: "sparchick",  name: "Sparchick",  type: "electric", icon: "⚡", cost: 1, hp: 16, atk: 6,  def: 2 },
  { id: "finbit",     name: "Finbit",     type: "water",     icon: "🐟", cost: 1, hp: 16, atk: 5,  def: 3 },
  { id: "flambub",    name: "Flambub",    type: "fire",      icon: "🔥", cost: 2, hp: 20, atk: 5,  def: 3 },
  { id: "aquorb",     name: "Aquorb",     type: "water",     icon: "💧", cost: 2, hp: 22, atk: 4,  def: 4 },
  { id: "leafkit",    name: "Leafkit",    type: "grass",     icon: "🌿", cost: 2, hp: 21, atk: 4,  def: 4 },
  { id: "mossling",   name: "Mossling",   type: "grass",     icon: "🍃", cost: 2, hp: 18, atk: 4,  def: 4 },
  { id: "pebblit",    name: "Pebblit",    type: "rock",       icon: "🪨", cost: 3, hp: 26, atk: 3,  def: 7 },
  { id: "voltjay",    name: "Voltjay",    type: "electric",  icon: "🦅", cost: 4, hp: 32, atk: 10, def: 4 },
  { id: "flamaul",    name: "Flamaul",    type: "fire",      icon: "🐉", cost: 5, hp: 40, atk: 9,  def: 6 },
  { id: "aquiron",    name: "Aquiron",    type: "water",     icon: "🐋", cost: 5, hp: 42, atk: 7,  def: 7 },
  { id: "florabeast", name: "Florabeast", type: "grass",     icon: "🌳", cost: 5, hp: 41, atk: 8,  def: 6 },
  { id: "boulderon",  name: "Boulderon",  type: "rock",       icon: "🗿", cost: 6, hp: 45, atk: 6,  def: 11 },
];

const TYPE_EFFECT = {
  fire:     { grass: 1.5, water: 0.6 },
  water:    { fire: 1.5, grass: 0.6 },
  grass:    { water: 1.5, fire: 0.6 },
  electric: { water: 1.5, rock: 0.6 },
  rock:     { fire: 1.5, electric: 0.6 },
};

function speciesById(id) { return SPECIES.find(s => s.id === id); }

function makeCard(speciesId) {
  const sp = speciesById(speciesId);
  return {
    uid: Math.random().toString(36).slice(2),
    speciesId,
    name: sp.name,
    type: sp.type,
    icon: sp.icon,
    cost: sp.cost,
    atk: sp.atk,
    hp: sp.hp,
    maxHp: sp.hp,
    resting: true,
    attacked: false,
  };
}

function buildDeck() {
  const cards = [];
  SPECIES.forEach(sp => {
    cards.push(makeCard(sp.id));
    cards.push(makeCard(sp.id));
  });
  return shuffle(cards);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ---------------- Game state ---------------- */
const START_LIFE = 25;
const MAX_ENERGY = 8;
const MAX_BOARD = 5;
const MAX_HAND = 8;

let state = null;

function newGame() {
  state = {
    turn: "player",
    turnNumber: 1,
    player: { life: START_LIFE, energy: 1, energyMax: 1, deck: buildDeck(), hand: [], board: [] },
    enemy:  { life: START_LIFE, energy: 1, energyMax: 1, deck: buildDeck(), hand: [], board: [] },
    selected: null,
    over: false,
  };
  drawCards(state.player, 4);
  drawCards(state.enemy, 4);
  clearLog();
  log("New game! You go first.");
  document.getElementById("overlay").style.display = "none";
  render();
}

function drawCards(side, n) {
  for (let i = 0; i < n; i++) {
    if (side.deck.length === 0) continue;
    if (side.hand.length >= MAX_HAND) break;
    side.hand.push(side.deck.pop());
  }
}

function clearLog() { document.getElementById("log").innerHTML = ""; }
function log(msg) {
  const el = document.getElementById("log");
  const line = document.createElement("div");
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

/* ---------------- Rendering ---------------- */
function render() {
  const p = state.player, e = state.enemy;

  document.getElementById("playerLife").textContent = `❤ ${Math.max(0,p.life)}`;
  document.getElementById("enemyLife").textContent = `❤ ${Math.max(0,e.life)}`;
  document.getElementById("playerEnergy").textContent = `⚡ ${p.energy}/${p.energyMax}`;
  document.getElementById("enemyEnergy").textContent = `⚡ ${e.energy}/${e.energyMax}`;
  document.getElementById("playerDeckCount").textContent = `Deck: ${p.deck.length}`;
  document.getElementById("enemyDeckCount").textContent = `Deck: ${e.deck.length}`;

  document.getElementById("turnBanner").textContent = state.over
    ? ""
    : (state.turn === "player" ? "Your turn — play cards and attack" : "Opponent's turn...");

  const enemyHandRow = document.getElementById("enemyHandRow");
  enemyHandRow.innerHTML = "";
  for (let i = 0; i < e.hand.length; i++) {
    const back = document.createElement("div");
    back.className = "miniBack";
    enemyHandRow.appendChild(back);
  }

  renderBoard("enemyBoard", e.board, "enemy");
  renderBoard("playerBoard", p.board, "player");
  renderHand();
}

function cardInnerHtml(card) {
  return `
    <div class="cost">${card.cost}</div>
    <div class="icon">${card.icon}</div>
    <div class="name">${card.name}</div>
    <div class="stats"><span class="atk">⚔${card.atk}</span><span class="hp">❤${Math.max(0,card.hp)}</span></div>
  `;
}

function renderBoard(elId, board, side) {
  const el = document.getElementById(elId);
  el.innerHTML = "";
  if (board.length === 0) {
    const slot = document.createElement("div");
    slot.className = "boardSlotEmpty";
    el.appendChild(slot);
  }
  board.forEach(card => {
    const div = document.createElement("div");
    const canAct = side === "player" && state.turn === "player" && !state.over;
    let cls = "card " + card.type;
    if (card.resting) cls += " resting";
    if (card.attacked) cls += " attacked";
    if (state.selected && state.selected.uid === card.uid) cls += " selected";
    div.className = cls;
    div.innerHTML = cardInnerHtml(card);

    if (side === "player") {
      div.addEventListener("click", () => selectAttacker(card));
    } else {
      div.addEventListener("click", () => targetEnemyCreature(card));
    }
    el.appendChild(div);
  });

  if (side === "enemy") {
    el.style.cursor = state.selected ? "pointer" : "default";
    el.addEventListener("click", (ev) => {
      if (ev.target === el && state.selected) targetEnemyFace();
    });
  }
}

function renderHand() {
  const handEl = document.getElementById("hand");
  handEl.innerHTML = "";
  const p = state.player;
  p.hand.forEach(card => {
    const div = document.createElement("div");
    const playable = state.turn === "player" && !state.over && card.cost <= p.energy && p.board.length < MAX_BOARD;
    div.className = "card " + card.type + (playable ? "" : " disabled");
    div.innerHTML = cardInnerHtml(card);
    div.addEventListener("click", () => playCard(card, playable));
    handEl.appendChild(div);
  });
}

/* ---------------- Player actions ---------------- */
function playCard(card, playable) {
  if (!playable) return;
  const p = state.player;
  p.energy -= card.cost;
  p.hand = p.hand.filter(c => c.uid !== card.uid);
  card.resting = true;
  card.attacked = false;
  p.board.push(card);
  log(`You played ${card.name}.`);
  render();
}

function selectAttacker(card) {
  if (state.turn !== "player" || state.over) return;
  if (card.resting || card.attacked) return;
  state.selected = (state.selected && state.selected.uid === card.uid) ? null : card;
  render();
}

function typeMultiplier(atkType, defType) {
  return (TYPE_EFFECT[atkType] && TYPE_EFFECT[atkType][defType]) || 1;
}

function targetEnemyCreature(defCard) {
  if (!state.selected || state.turn !== "player" || state.over) return;
  const atkCard = state.selected;
  const mult = typeMultiplier(atkCard.type, defCard.type);
  const dmg = Math.max(1, Math.round(atkCard.atk * mult));
  defCard.hp -= dmg;
  log(`${atkCard.name} attacked ${defCard.name} for ${dmg}${mult > 1 ? " (super effective!)" : mult < 1 ? " (not very effective)" : ""}.`);
  atkCard.attacked = true;
  state.selected = null;

  if (defCard.hp <= 0) {
    log(`${defCard.name} was defeated!`);
    state.enemy.board = state.enemy.board.filter(c => c.uid !== defCard.uid);
  }
  render();
  checkGameOver();
}

function targetEnemyFace() {
  if (!state.selected || state.turn !== "player" || state.over) return;
  const atkCard = state.selected;
  state.enemy.life -= atkCard.atk;
  log(`${atkCard.name} attacked the opponent directly for ${atkCard.atk}.`);
  atkCard.attacked = true;
  state.selected = null;
  render();
  checkGameOver();
}

/* ---------------- Turn flow ---------------- */
document.getElementById("endTurnBtn").addEventListener("click", () => {
  if (state.turn !== "player" || state.over) return;
  state.selected = null;
  startTurn("enemy");
  render();
  setTimeout(enemyTurn, 700);
});

function startTurn(side) {
  state.turn = side;
  const s = state[side];
  s.energyMax = Math.min(MAX_ENERGY, s.energyMax + 1);
  s.energy = s.energyMax;
  s.board.forEach(c => { c.resting = false; c.attacked = false; });
  drawCards(s, 1);
  if (side === "player") state.turnNumber++;
}

function enemyTurn() {
  if (state.over) return;
  const e = state.enemy, p = state.player;

  // Play creatures greedily: biggest affordable first, while board has room
  let playedSomething = true;
  while (playedSomething) {
    playedSomething = false;
    const affordable = e.hand
      .filter(c => c.cost <= e.energy)
      .sort((a, b) => b.cost - a.cost);
    if (affordable.length > 0 && e.board.length < MAX_BOARD) {
      const card = affordable[0];
      e.energy -= card.cost;
      e.hand = e.hand.filter(c => c.uid !== card.uid);
      card.resting = true;
      card.attacked = false;
      e.board.push(card);
      log(`Opponent played ${card.name}.`);
      playedSomething = true;
    }
  }
  render();

  setTimeout(() => {
    // Attack phase
    const readyAttackers = e.board.filter(c => !c.resting && !c.attacked);
    readyAttackers.forEach(atkCard => {
      if (state.over) return;
      // prefer a kill on a player creature, else biggest trade, else face
      let bestTarget = null, bestScore = -Infinity;
      p.board.forEach(defCard => {
        const mult = typeMultiplier(atkCard.type, defCard.type);
        const dmg = Math.max(1, Math.round(atkCard.atk * mult));
        const kills = dmg >= defCard.hp;
        const score = (kills ? 100 : 0) + dmg;
        if (score > bestScore) { bestScore = score; bestTarget = defCard; }
      });

      if (bestTarget && bestScore >= 0) {
        const mult = typeMultiplier(atkCard.type, bestTarget.type);
        const dmg = Math.max(1, Math.round(atkCard.atk * mult));
        bestTarget.hp -= dmg;
        log(`Opponent's ${atkCard.name} attacked your ${bestTarget.name} for ${dmg}.`);
        atkCard.attacked = true;
        if (bestTarget.hp <= 0) {
          log(`Your ${bestTarget.name} was defeated!`);
          p.board = p.board.filter(c => c.uid !== bestTarget.uid);
        }
      } else {
        p.life -= atkCard.atk;
        log(`Opponent's ${atkCard.name} attacked you directly for ${atkCard.atk}.`);
        atkCard.attacked = true;
      }
    });

    render();
    checkGameOver();
    if (!state.over) {
      startTurn("player");
      render();
    }
  }, 700);
}

function checkGameOver() {
  if (state.player.life <= 0) {
    endGame("Opponent wins!");
  } else if (state.enemy.life <= 0) {
    endGame("You win!");
  } else if (state.player.deck.length === 0 && state.player.hand.length === 0 && state.player.board.length === 0) {
    endGame("Opponent wins! (You ran out of cards)");
  } else if (state.enemy.deck.length === 0 && state.enemy.hand.length === 0 && state.enemy.board.length === 0) {
    endGame("You win! (Opponent ran out of cards)");
  }
}

function endGame(msg) {
  state.over = true;
  document.getElementById("overlayTitle").textContent = msg;
  document.getElementById("overlay").style.display = "flex";
  log(msg);
}

document.getElementById("newGameBtn").addEventListener("click", newGame);
document.getElementById("overlayBtn").addEventListener("click", newGame);

newGame();
</script>

</body>
</html>
